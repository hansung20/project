<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>호텔 사전 체크인</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  
  <!-- Google Fonts (SF Pro for iOS-like typography) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overscroll-behavior: none;
    }

    h2 {
      color: #1d1d1f;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    form {
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 1.5rem;
      border-radius: 1.2rem;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 360px;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    label {
      display: block;
      margin-bottom: 1.2rem;
      color: #1d1d1f;
      font-size: 0.95rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.6rem;
      background: #f0f0f2;
      color: #1d1d1f;
      box-sizing: border-box;
      transition: background 0.2s ease;
    }

    input:focus {
      outline: none;
      background: #e8e8ea;
    }

    button {
      width: 100%;
      padding: 0.9rem;
      font-size: 1.05rem;
      font-weight: 500;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 0.6rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover,
    button:active {
      background: #0062cc;
      transform: scale(0.98);
    }

    button:focus {
      outline: none;
    }

    @media (max-width: 400px) {
      form {
        padding: 1rem;
      }

      h2 {
        font-size: 1.5rem;
      }

      input, button {
        font-size: 0.95rem;
      }
    }

    /* Smooth transitions for iOS feel */
    input, button {
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>
  <h2>호텔 사전 체크인</h2>
  <form id="checkin-form">
    <label>
      이름
      <input type="text" id="name" required placeholder="이름을 입력하세요" />
    </label>
    <label>
      방 호수
      <input type="number" id="room" required placeholder="방 호수를 입력하세요" />
    </label>
    <button type="submit">등록</button>
  </form>

  <script>
    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyD2RwL38m3jy15wUtrnKvwcMErz1DcPL-s",
      authDomain: "team20-61dd7.firebaseapp.com",
      databaseURL: "https://team20-61dd7-default-rtdb.firebaseio.com",
      projectId: "team20-61dd7",
      storageBucket: "team20-61dd7.appspot.com",
      messagingSenderId: "479436179391",
      appId: "1:479436179391:web:8deb6f166c2f68e828430a",
      measurementId: "G-JTN726YSSY"
    };

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 폼 제출 이벤트
    document.getElementById('checkin-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const room = document.getElementById('room').value.trim();

      if (name && room) {
        const guestRef = db.ref('guests').push();
        guestRef.set({
          name: name,
          room: parseInt(room),
          face_registered: false
        }).then(() => {
          alert('사전 체크인이 완료되었습니다!');
          document.getElementById('checkin-form').reset();
        }).catch((error) => {
          alert('오류 발생: ' + error.message);
        });
      }
    });
  </script>
</body>
</html>
