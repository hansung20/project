<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>호텔 사전 체크인</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  
  <!-- Google Fonts (for clean iOS look) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #f0f4f8, #dfe9f3);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h2 {
      color: #333;
      margin-bottom: 1rem;
    }

    form {
      background-color: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
    }

    label {
      display: block;
      margin-bottom: 1.5rem;
      color: #333;
      font-size: 1rem;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      margin-top: 0.5rem;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #357ABD;
    }

    @media (max-width: 400px) {
      form {
        padding: 1.2rem;
      }

      input, button {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <h2>호텔 사전 체크인</h2>
  <form id="checkin-form">
    <label>
      이름:
      <input type="text" id="name" required />
    </label>
    <label>
      방 호수:
      <input type="number" id="room" required />
    </label>
    <button type="submit">등록</button>
  </form>

  <script>
    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyD2RwL38m3jy15wUtrnKvwcMErz1DcPL-s",
      authDomain: "team20-61dd7.firebaseapp.com",
      databaseURL: "https://team20-61dd7-default-rtdb.firebaseio.com",
      projectId: "team20-61dd7",
      storageBucket: "team20-61dd7.appspot.com",
      messagingSenderId: "479436179391",
      appId: "1:479436179391:web:8deb6f166c2f68e828430a",
      measurementId: "G-JTN726YSSY"
    };

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 폼 제출 이벤트
    document.getElementById('checkin-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const room = document.getElementById('room').value.trim();

      if (name && room) {
        const guestRef = db.ref('guests').push();
        guestRef.set({
          name: name,
          room: parseInt(room),
          face_registered: false
        }).then(() => {
          alert('사전 체크인이 완료되었습니다!');
          document.getElementById('checkin-form').reset();
        }).catch((error) => {
          alert('오류 발생: ' + error.message);
        });
      }
    });
  </script>
</body>
</html>
